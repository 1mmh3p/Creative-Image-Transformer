<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Image Transformer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-charcoal': '#121212',
            'dark-card': '#1E1E1E',
            'text-primary': '#F5F5F5',
            'text-secondary': '#A3A3A3',
            'brand-gold': '#D4AF37',
            'brand-gold-light': '#F0C44D',
            'brand-purple': '#8A2BE2',
            'brand-purple-light': '#A052E8',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          keyframes: {
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'subtle-glow': {
              '0%, 100%': { boxShadow: '0 0 15px -5px rgba(212, 175, 55, 0.3)' },
              '50%': { boxShadow: '0 0 25px -5px rgba(138, 43, 226, 0.4)' },
            }
          },
          animation: {
            'fade-in': 'fade-in 0.5s ease-out forwards',
            'subtle-glow': 'subtle-glow 4s ease-in-out infinite',
          },
        },
      },
    }
  </script>
  <style>
    body {
      background-color: #121212; /* dark-charcoal */
    }
    .rtl {
      direction: rtl;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
      "react-dropzone": "https://aistudiocdn.com/react-dropzone@^14.3.8"
    }
  }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
